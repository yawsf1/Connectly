[build]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction",
  "npm ci",
  "npm run build",
  "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache",
  "chmod -R a+rw storage"
]

[start]
cmd = "sleep 5 && php artisan migrate --force && php artisan config:clear && php artisan cache:clear && php artisan storage:link && php-fpm -D && nginx -g 'daemon off;'"